<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita Cuaca Terkini</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/berita.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>

  <!-- Animasi Awan -->
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <!-- HEADER -->
  <header>
    <h1>📡 Info Cuaca</h1>
    <nav>
      <ul>
        <li><a href="home.html">Beranda</a></li>
        <li><a href="berita.html" class="active">Berita</a></li>
        <li><a href="bantuan.html">Bantuan</a></li>
        <li><a href="tentang.html">Profile</a></li>
      </ul>
    </nav>
  </header>

  <!-- KONTEN -->
  <main>
    <h2 class="page-title">Berita & Peringatan Dini Cuaca</h2>
    <section class="news-grid" id="newsGrid">
      <p>Memuat berita...</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Portal Cuaca | Sumber Data: Mediastack</p>
  </footer>

  <script>
    const newsGrid = document.getElementById("newsGrid");

    fetch("/api/berita")
      .then(res => res.json())
      .then(data => {
        newsGrid.innerHTML = "";
        if (!data || data.length === 0) {
          newsGrid.innerHTML = "<p>Berita tidak tersedia saat ini.</p>";
          return;
        }

        data.forEach(item => {
          const article = document.createElement("article");

          const title = item.title || "Judul tidak tersedia";
          const description = item.description || "Deskripsi tidak tersedia";
          const url = item.url || "#";
          const source = item.source || "Sumber tidak diketahui";
          const publishedDate = item.published_at ? new Date(item.published_at).toLocaleDateString("id-ID") : "-";

          let tagText = "📰 Berita Cuaca";
          let tagClass = "cat-info";
          const lowerTitle = title.toLowerCase();
          if (lowerTitle.includes("peringatan") || lowerTitle.includes("badai") || lowerTitle.includes("banjir")) {
            tagText = "⚠️ Peringatan Dini";
            tagClass = "cat-warning";
          }

          article.innerHTML = `
            <span class="category-tag ${tagClass}">${tagText}</span>
            <h2>${title}</h2>
            <p>${description}</p>
            <div class="news-footer">
              <span>${publishedDate} - ${source}</span>
              <a href="${url}" target="_blank" class="read-more">Baca Selengkapnya →</a>
            </div>
          `;
          newsGrid.appendChild(article);
        });
      })
      .catch(err => {
        console.error(err);
        newsGrid.innerHTML = "<p>Gagal memuat berita. Silakan coba lagi nanti.</p>";
      });
  </script>

</body>
</html>
