<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWeather - Homepage Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span>⛅</span> SkyWeather
            </div>
           
            <div class="nav-buttons">
                <a href="login.html" class="btn btn-text">Masuk</a>
                <a href="register.html" class="btn btn-primary">Daftar</a>
            </div>
        </div>
    </header>

    <main class="hero-section">
        <div class="container hero-container">
            <div class="hero-text-block">
                <h1>Pantau Cuaca Harianmu Secara Akurat & Real-Time</h1>
                <p>Dapatkan informasi cuaca terkini, prediksi hujan, dan peringatan dini di lokasimu agar aktivitas harian tetap lancar tanpa hambatan.</p>
                <a href="login.html" class="btn btn-cta-large">Lihat Cuaca Sekarang</a>
            </div>

            <div class="hero-image-block">
                <div class="weather-card-illustration">
                    <div class="weather-icon-wrapper">
                        <div class="sun"></div>
                        <div class="cloud-big"></div>
                        <div class="rain-drop r1"></div>
                        <div class="rain-drop r2"></div>
                        <div class="rain-drop r3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
