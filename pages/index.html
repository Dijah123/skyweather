<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Cek Cuaca</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/home.css">
</head>
<body>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <header>
    <h1>🌤️ SkyWeather</h1>
    <nav>
      <a href="/index.html" class="active">Beranda</a>
      <a href="/berita.html">Berita</a>
      <a href="/bantuan.html">Bantuan</a>
      <a href="/tentang.html">Profile</a>
    </nav>
  </header>

  <main>
    <section class="weather-card">
      <h2>Cek Cuaca Kota Kamu</h2>
      <form id="formCuaca">
        <input 
          type="text" 
          id="inputKota" 
          placeholder="Masukkan nama kota..." 
          autocomplete="off"
        >
        <button type="submit">Cari</button>
      </form>

      <div id="hasilCuaca">
        <div style="opacity: 0.6; margin-top: 30px;">
          <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" width="80" alt="sun">
          <p style="margin-top:10px;">Ayo cek cuaca hari ini!</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Dinda | Pendidikan Teknik Informatika</p>
  </footer>

  <script>
    const formCuaca = document.getElementById('formCuaca');
    const inputKota = document.getElementById('inputKota');
    const hasilCuaca = document.getElementById('hasilCuaca');

    formCuaca.addEventListener('submit', async (e) => {
      e.preventDefault();
      const kota = inputKota.value.trim();

      if (!kota) {
        alert('Mohon masukkan nama kota!');
        return;
      }

      hasilCuaca.innerHTML = '<p style="margin-top:20px;">🔍 Sedang mencari ke langit...</p>';

      try {
        const response = await fetch(`/cuaca/${encodeURIComponent(kota)}`);
        
        if (!response.ok) throw new Error('Kota tidak ditemukan');
        const data = await response.json();

        hasilCuaca.innerHTML = `
          <div class="weather-result">
            <h3 style="font-size: 1.5rem;">${data.name}, ${data.sys.country}</h3>
            
            <div class="weather-main">
              <img src="https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png" alt="icon">
              <p class="temp">${Math.round(data.main.temp)}°</p>
              <p class="desc">${data.weather[0].description}</p>
            </div>

            <div class="weather-details">
              <div class="detail-box">
                🌡️ Terasa
                <span>${Math.round(data.main.feels_like)}°C</span>
              </div>
              <div class="detail-box">
                💧 Lembab
                <span>${data.main.humidity}%</span>
              </div>
              <div class="detail-box">
                🌬️ Angin
                <span>${data.wind.speed} m/s</span>
              </div>
              <div class="detail-box">
                🔽 Tekanan
                <span>${data.main.pressure} hPa</span>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error(error);
        hasilCuaca.innerHTML = `
          <div style="margin-top: 20px; color: #e74c3c;">
            ❌ <strong>Oops!</strong><br>Kota tidak ditemukan atau server offline.
          </div>
        `;
      }
    });
  </script>
</body>
</html>
